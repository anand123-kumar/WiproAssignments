<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Pooja Store</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .navbar-custom {
            background-color: #f1c40f;
            padding: 0.5rem 0;
        }
        .navbar-brand {
            color: #000 !important;
            font-weight: bold;
            font-size: 1.5rem;
        }
        .navbar-nav .nav-link {
            color: #000 !important;
            font-weight: 500;
            margin-right: 1rem;
        }
        .navbar-nav .nav-link:hover {
            color: #333 !important;
        }
        .search-container {
            display: flex;
            align-items: center;
        }
        .search-input {
            border: 1px solid #ccc;
            padding: 8px 12px;
            border-radius: 4px 0 0 4px;
            border-right: none;
            width: 200px;
        }
        .search-btn {
            background-color: #e74c3c;
            color: white;
            border: 1px solid #e74c3c;
            padding: 8px 15px;
            border-radius: 0 4px 4px 0;
            cursor: pointer;
        }
        .search-btn:hover {
            background-color: #c0392b;
        }
        .dropdown-menu {
            background-color: white;
            border: 1px solid #ddd;
        }
        .dropdown-item {
            color: #000;
            padding: 8px 16px;
        }
        .dropdown-item:hover {
            background-color: #f8f9fa;
        }
        .navbar-toggler {
            border: none;
            color: #000;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-custom">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Online Pooja Store</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="#">Home</a>
                    </li>
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            Products
                        </a>
                        <ul class="dropdown-menu">
                            <li><a class="dropdown-item" href="#">Pooja Kits</a></li>
                            <li><a class="dropdown-item" href="#">Idols</a></li>
                            <li><a class="dropdown-item" href="#">Flowers</a></li>
                            <li><a class="dropdown-item" href="#">Incense Sticks</a></li>
                        </ul>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Offers</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Cart</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#">Contact Us</a>
                    </li>
                </ul>
                
                <div class="search-container">
                    <input type="text" class="search-input" placeholder="Search products...">
                    <button class="search-btn">Search</button>
                </div>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h1>Welcome to Online Pooja Store</h1>
        <p>Your one-stop destination for all pooja essentials.</p>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.0/js/bootstrap.bundle.min.js"></script>
</body>
</html>
