<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sports Team Player Details</title>
</head>
<body>

<pre id="output"></pre>

<script>
    const player1 = {
        name: "ROHIT SHARMA",
        age: 36,
        sport: "Cricket",
        stats: {
            matches: 300,
            runs: 28500,
            average: 77.2
        }
    };

    const player2 = {
        name: "Cristiano Ronaldo",
        age: 33,
        sport: "Football",
        stats: {
            matches: 580,
            goals: 950,
            assists: 400
        }
    };

    const players = [player1, player2];

    let outputText = "";

    const [p1, p2] = players;

    const { name: name1, sport: sport1, stats: { matches: matches1, runs, average } } = p1;
    outputText += `Player ${name1} plays ${sport1}.\n`;
    outputText += `Matches: ${matches1} | Runs: ${runs} | Batting Average: ${average}\n`;

    const { name: name2, sport: sport2, stats: { matches: matches2, goals, assists } } = p2;
    outputText += `Player ${name2} plays ${sport2}.\n`;
    outputText += `Matches: ${matches2} | Goals: ${goals} | Assists: ${assists}\n`;

    document.getElementById("output").textContent = outputText;
</script>

</body>
</html>
