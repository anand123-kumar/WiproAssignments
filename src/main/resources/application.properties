spring.application.name=SpringBootMicroserviceCircuitBreakerAssignment
# Server Configuration
server.port=8082

# Resilience4j Circuit Breaker Configuration
resilience4j.circuitbreaker.instances.delivery-service.register-health-indicator=true
resilience4j.circuitbreaker.instances.delivery-service.sliding-window-size=10
resilience4j.circuitbreaker.instances.delivery-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.delivery-service.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.instances.delivery-service.wait-duration-in-open-state=30s
resilience4j.circuitbreaker.instances.delivery-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.delivery-service.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.delivery-service.slow-call-duration-threshold=2s

# Actuator endpoints for monitoring
management.endpoints.web.exposure.include=health,circuitbreakers
management.endpoint.health.show-details=always