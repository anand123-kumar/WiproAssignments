spring.application.name=SpringCloudAPIGatewayAssignment
# Server configuration
server.port=8083

# Spring Cloud Gateway routing configuration
spring.cloud.gateway.routes[0].id=employee-service
spring.cloud.gateway.routes[0].uri=http://localhost:8001
spring.cloud.gateway.routes[0].predicates[0]=Path=/employee/**
spring.cloud.gateway.routes[0].filters[0]=AddRequestHeader=X-Gateway-Source,Spring-Cloud-Gateway

# Optional: Enable gateway actuator endpoints for monitoring
management.endpoints.web.exposure.include=gateway